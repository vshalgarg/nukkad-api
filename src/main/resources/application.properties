#Application
spring.application.name=nukkad_App
spring.profiles.active=local

#Database
spring.datasource.url=jdbc:mysql://localhost:3306/nukkad_db
spring.datasource.username=root
spring.datasource.password=123451
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# DB Connection Pool  must match Firebase thread count

spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=10

# JPA / Hibernate Configuration
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=update

#Hibernate can auto-detect the dialect from your datasource.
#spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Batching (CORE)
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false

# turn off all Hibernate SQL noise
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=OFF

# keep app logs visible
logging.level.com.code.monks.nukkad=INFO

# IMPORTANT ADDITIONS
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

external.otp.api.url=http://Your-auth-service/api/otp
spring.sql.init.mode=always

#Auth Service
auth.host=http://192.168.1.100/auth
auth.login.url=/api/v1/login
auth.register.url=/api/v1/register
auth.otp.url=/api/v1/send/otp
auth.verify.otp.url=/api/v1/verify/otp
auth.Verify.firebaseToken.url=/api/v1/verify/firebase/token
auth.validateToken.url=/api/v1/validate/token
auth.userAccountDeactivate.url = /api/v1/user/inactive
auth.client.name=NUKKAD
auth.client.secret=q3F+hzK1Dnsyv7rQOtkR+DQIJdAlPHBr8AlYQ3ZqvE8=
auth.mock.local=false

#firebase
#this below line we use when we keep firebase json in prod but here we are using it in our local
#firebase.credentials.path=${FIREBASE_CREDENTIAL_PATH}
firebase.credentials.path=classpath:firebase.json
firebase.bucket.name=nukkad-app-ad9c9.firebasestorage.app

#Logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [requestId=%X{requestId}] %msg%n



