spring.application.name=nukkad_App

spring.profiles.active=local

spring.datasource.url=jdbc:mysql://localhost:3306/nukkadapp_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.sql.init.mode=always

spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
image.upload.dir=D:/nukkad/uploads/storekeepers

# Firebase Configuration
firebase.credentials.path=${FIREBASE_CREDENTIAL_PATH}
#firebase.credentials.path=classpath:firebase-service-account.json
firebase.bucket.name=nukkad-app-ad9c9.firebasestorage.app

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [requestId=%X{requestId}] %msg%n




